seed: 42
elastic_net:
  alpha: [0.001, 0.01, 0.1, 1.0]
  l1_ratio: [0.1, 0.5, 0.9]
  max_iter: 5000
xgboost:
  n_jobs: 1
  search:
    - {n_estimators: 250, max_depth: 2, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 1.0}
    - {n_estimators: 400, max_depth: 2, learning_rate: 0.03, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 3.0}
    - {n_estimators: 250, max_depth: 3, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 3.0}
    - {n_estimators: 300, max_depth: 4, learning_rate: 0.03, subsample: 0.8, colsample_bytree: 0.8, reg_lambda: 5.0}
mlp:
  hidden_layer_sizes: [64, 32]
  activation: relu
  alpha: 0.001
  early_stopping: group_aware_manual
  patience: 20
  min_delta: 0.00001
  max_iter: 300
  primary_seed: 42
  additional_seeds: [123, 2026]
baselines:
  dummy_strategy: mean
  subclass_model: ridge

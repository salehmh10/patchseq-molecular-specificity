duplicate_policy:
  retain: rheobase_i
  drop: stimulus_amplitude_0_long_square
  missing_count: 11
  complete_pairs: 3399
  exhaustive_pair_scan: true

models:
  inner_validation_fraction: 0.20
  inner_split_method: GroupShuffleSplit
  elastic_net:
    alpha: [0.001, 0.01, 0.1, 1.0]
    l1_ratio: [0.1, 0.5, 0.9]
    max_iter: 5000
    random_state: 42
  xgboost:
    grid:
      - {n_estimators: 250, max_depth: 2, learning_rate: 0.05, reg_lambda: 1.0}
      - {n_estimators: 400, max_depth: 2, learning_rate: 0.03, reg_lambda: 3.0}
      - {n_estimators: 250, max_depth: 3, learning_rate: 0.05, reg_lambda: 3.0}
      - {n_estimators: 300, max_depth: 4, learning_rate: 0.03, reg_lambda: 5.0}
    subsample: 0.8
    colsample_bytree: 0.8
    objective: reg:squarederror
    tree_method: hist
    n_jobs: 1
    random_state: 42
  mlp:
    hidden_layer_sizes: [64, 32]
    activation: relu
    solver: adam
    learning_rate: constant
    learning_rate_init: 0.001
    alpha: 0.001
    batch_size: auto
    shuffle: true
    ensemble_seeds: [42, 123, 2026]
    maximum_epochs: 300
    patience: 20
    min_delta: 0.00001
    early_stopping: group_aware_manual
    sklearn_early_stopping: false
  comparators:
    dummy_strategy: mean
    ridge_alpha: 1.0

inference:
  bootstrap_draws: 5000
  permutation_draws: 5000
  ci: [0.025, 0.975]
  bh_family_n: 18
  bh_q: 0.05
  common_donor_plan_across_contrasts: true
  r2_tail: inclusive_zero_plus_one_two_sided

within_subclass:
  minimum_cells: 150
  minimum_donors: 3
  analyze_all_threshold_eligible: true
  historical_top_two: [Sst, Pvalb]
  folds: 3

repeated_cv:
  seeds: [42, 123, 2026, 31415, 27182]
  models: [ElasticNet, XGBoost, MLP]
  fold_method: StratifiedGroupKFold
  fixed_classical_configuration_source: revised_primary_fold0

interpretability:
  shap_constructor: shap.TreeExplainer(estimator)
  shap_call: explainer(transformed, check_additivity=False)
  shap_default_requested: auto_argument_omitted
  shap_resolved_required: tree_path_dependent
  shap_model_output_required: raw
  correlation_method: spearman_pairwise_complete
  correlation_threshold_strict: 0.90
  group_aggregation: sum_absolute
  cross_family_aggregation: equal_fold_mean

specificity_bridge:
  controls_per_module: 200
  refit_features: 23
  control_xgboost_retune: false
  fixed_configuration_source: revised_observed_module_fold
  smoke_module: GABAA
  smoke_controls: 5
  run_adjusted_xgboost: true

smoke:
  modules: [GABAA]
  folds: [0]
  mlp_seeds: [42]
  repeated_seeds: [42]
  bootstrap_draws: 50
  permutation_draws: 50
  within_subclasses: [Sst]

outputs:
  results: results/revision_v3/section2
  figures: figures/revision_v3/section2
  logs: logs/revision_v3/section2
  models: models/revision_v3/section2

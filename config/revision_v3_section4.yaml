duplicate_policy:
  retain: rheobase_i
  drop: stimulus_amplitude_0_long_square
  missing_count: 11
  complete_pairs: 3399
  exhaustive_pair_scan: true

matching:
  controls_per_primary_module: 1000
  existing_controls_per_module: 200
  controls_per_nav7: 1000
  checkpoint_every: 10
  nearest_neighbor_pool: 128
  maximum_attempts_per_set: 200
  max_per_gene_standardized_distance: 0.50
  max_mean_per_gene_standardized_distance: 0.25
  max_module_abs_standardized_mean_difference: 0.10
  max_module_abs_standardized_detection_difference: 0.10

models:
  elastic_net:
    alpha: [0.001, 0.01, 0.1, 1.0]
    l1_ratio: [0.1, 0.5, 0.9]
    max_iter: 5000
  xgboost:
    grid:
      - {n_estimators: 250, max_depth: 2, learning_rate: 0.05, reg_lambda: 1.0}
      - {n_estimators: 400, max_depth: 2, learning_rate: 0.03, reg_lambda: 3.0}
      - {n_estimators: 250, max_depth: 3, learning_rate: 0.05, reg_lambda: 3.0}
      - {n_estimators: 300, max_depth: 4, learning_rate: 0.03, reg_lambda: 5.0}
    subsample: 0.8
    colsample_bytree: 0.8
    objective: reg:squarederror
    tree_method: hist
    n_jobs: 1
    random_state: 42
  mlp:
    hidden_layer_sizes: [64, 32]
    activation: relu
    solver: adam
    learning_rate: constant
    learning_rate_init: 0.001
    alpha: 0.001
    batch_size: auto
    shuffle: true
    ensemble_seeds: [42, 123, 2026]
    maximum_epochs: 300
    patience: 20
    min_delta: 0.00001
  comparators:
    dummy_strategy: mean
    ridge_alpha: 1.0

inference:
  bh_q: 0.05
  raw_family_n: 6
  residual_family_n: 6
  percentile_ties: less_equal

reliability:
  maximum_partitions_per_control: 100
  score_dtype: float32

retuning:
  controls_per_module: 50
  subset_base_seed: 42

residualization:
  nuisance_covariates: [log10_total_counts, log10_genes_detected]
  nuisance_model: linear_regression
  control_configuration_source: observed_adjusted_target_module_fold

smoke:
  module: GABAA
  generated_control_ids: [200, 201, 202, 203, 204, 205, 206, 207, 208, 209]
  fold: 0
  reliability_controls: 5
  retuned_controls: 2
  residual_controls: 2

outputs:
  results: results/revision_v3/section4
  figures: figures/revision_v3/section4
  logs: logs/revision_v3/section4
  models: models/revision_v3/section4
